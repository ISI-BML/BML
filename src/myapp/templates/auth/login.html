{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<h1>Iniciar Sesión</h1>
<form method="post">
  <label>
    Nombre de usuario
    <input type="text" name="username" required>
  </label>

  <label>
    Contraseña
    <input type="password" name="password" required>
  </label>

  <button type="submit">Entrar</button>
</form>
{% endblock %}
